{{- $ollama := .Values.ollama -}}
{{- if $ollama.enabled }}
{{- if $ollama.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $ollama.storage.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: {{ $ollama.image | quote }}
          imagePullPolicy: {{ $ollama.imagePullPolicy | quote }}
          ports:
            - containerPort: {{ $ollama.port }}
          command: ["sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5
              if ! ollama list | awk 'NR > 1 {print $1}' | grep -qx {{ $ollama.model | quote }}; then
                ollama pull {{ $ollama.model }}
              fi
              ollama cp {{ $ollama.model }} default || true
              wait
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
{{- if $ollama.storage.enabled }}
          persistentVolumeClaim:
            claimName: ollama-data
{{- else }}
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: {{ $ollama.port }}
      targetPort: {{ $ollama.port }}
{{- end }}
